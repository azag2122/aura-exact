<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Aura" />
  <meta name="theme-color" content="#F2F1F8" />
  <title>Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F2F1F8;
      --pink: #EE2687;
      --pink-hot: #F23A96;
      --magenta: #D6288A;
      --purple: #6B2D9B;
      --purple-deep: #3B1C59;
      --purple-mid: #5B2490;
      --text: #1A1224;
      --muted: #6E6778;
      --tab-muted: #9A93A3;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --grad-brand: linear-gradient(155deg, #F04A9A 0%, #E03895 28%, #AE55A3 52%, #7D399D 78%, #5A2D91 100%);
      --grad-btn: linear-gradient(90deg, #EE2687 0%, #A02DB8 100%);
      --grad-fab: linear-gradient(160deg, #F23A96 0%, #7B2BB8 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: #000;
      font-family: "Poppins", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }
    .phone {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 480px) {
      .phone { max-width: none; width: 100%; height: 100%; }
      html, body { background: var(--bg); }
    }
    .main {
      flex: 1;
      overflow: hidden;
      padding: calc(8px + var(--safe-top)) 16px 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .wallet {
      background: var(--grad-brand);
      border-radius: 22px;
      padding: 16px 18px 12px;
      color: #fff;
      box-shadow: 0 12px 32px rgba(90, 20, 120, 0.32);
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .member {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.6px;
      opacity: 0.98;
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }
    .qr-wrap {
      background: #fff;
      border-radius: 14px;
      padding: 10px;
      width: min(58vw, 220px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }
    .qr-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .wallet-foot {
      width: 100%;
      margin-top: 16px;
      padding: 12px 2px;
      border-top: 1px solid rgba(255,255,255,0.72);
      border-bottom: 1px solid rgba(255,255,255,0.72);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.1px;
      line-height: 1.2;
    }
    .balance {
      display: flex; align-items: center; gap: 6px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.15px;
    }
    .aed {
      width: 16px; height: 16px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
      filter: brightness(0) invert(1);
    }
    .chev {
      margin-top: 10px;
      width: 18px; height: 10px;
      display: block;
      opacity: 0.95;
    }
    .offers {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      align-items: flex-start;
    }
    .offers::-webkit-scrollbar { display: none; }
    .offer {
      flex: 0 0 78%;
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 2px 14px rgba(59, 28, 89, 0.07);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto 1fr auto;
      gap: 10px 12px;
      min-height: 148px;
    }
    .offer h3 {
      grid-column: 1;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.15px;
      color: var(--text);
    }
    .pass-thumb {
      grid-column: 2;
      grid-row: 1 / span 2;
      width: 86px;
      height: 86px;
      border-radius: 14px;
      background: var(--grad-brand);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.4px;
      line-height: 1.2;
      box-shadow: 0 4px 14px rgba(90, 20, 120, 0.28);
    }
    .pass-thumb .big { font-size: 15px; margin-top: 4px; letter-spacing: 0; }
    .get {
      grid-column: 1;
      grid-row: 3;
      justify-self: start;
      border: 0;
      border-radius: 999px;
      padding: 10px 22px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      background: var(--grad-btn);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(180, 40, 140, 0.38);
    }
    .get:active { transform: scale(0.97); opacity: 0.92; }
    .offer.secondary h3 { font-size: 15px; }
    .offer.secondary { opacity: 0.95; flex-basis: 70%; }

    .scrim {
      position: absolute; inset: 0;
      background: rgba(40, 16, 70, 0.48);
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s ease;
      z-index: 10;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 11;
      background: #fff;
      border-radius: 22px 22px 0 0;
      padding: 14px 18px calc(18px + var(--safe-bottom));
      transform: translateY(110%);
      transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 88%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -12px 40px rgba(0,0,0,0.18);
    }
    .sheet.open { transform: translateY(0); }
    .sheet-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      margin-bottom: 12px;
      min-height: 36px;
    }
    .sheet-head h2 {
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      grid-column: 1 / -1;
      pointer-events: none;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    .x {
      grid-column: 2;
      grid-row: 1;
      width: 32px; height: 32px;
      border: 0; background: transparent;
      font-size: 22px; line-height: 1; color: #222;
      cursor: pointer; justify-self: end;
      font-family: inherit;
    }
    .panel {
      border: 1px solid #E8E6EE;
      background: #F8F7FB;
      border-radius: 16px;
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .panel img {
      width: min(62vw, 240px);
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 8px;
    }
    .panel p {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      font-weight: 400;
    }
    .or {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #A39EAB;
      font-size: 12px;
      font-weight: 600;
    }
    .or::before, .or::after {
      content: ""; flex: 1; height: 1px; background: #E4E1EA;
    }
    .linkish {
      font-size: 13px;
      color: var(--text);
      text-align: center;
      line-height: 1.4;
      max-width: 280px;
      font-weight: 400;
    }
    .scans {
      margin-top: 14px;
      background: #EEF2F8;
      border-radius: 999px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }
    .scans svg { flex-shrink: 0; opacity: 0.7; }
    .terms {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--purple-deep);
      text-decoration: none;
    }

    .tabbar {
      flex-shrink: 0;
      height: calc(64px + var(--safe-bottom));
      padding: 6px 6px calc(6px + var(--safe-bottom));
      background: #fff;
      border-top: 1px solid #EDEAF2;
      display: grid;
      grid-template-columns: 1fr 1fr 1.15fr 1fr 1fr;
      align-items: end;
      gap: 2px;
      z-index: 5;
    }
    .tab {
      border: 0; background: transparent; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 500; color: var(--tab-muted);
      padding: 0; font-family: inherit;
    }
    .tab.active { color: var(--purple-deep); }
    .tab svg { width: 22px; height: 22px; }
    .tab-aura {
      position: relative; top: -18px;
    }
    .tab-aura .fab {
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--grad-fab);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-size: 9px; font-weight: 700; gap: 2px;
      box-shadow: 0 6px 18px rgba(160, 40, 140, 0.4);
      border: 3px solid #fff;
      letter-spacing: 0.2px;
    }
    .tab-aura .fab svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="phone" id="app">

    <div class="main">
      <section class="wallet" aria-label="Aura wallet">
        <div class="member">6111000128971960</div>
        <div class="qr-wrap"><img src="qr.png" alt="Member QR" /></div>
        <div class="wallet-foot">
          <span>Aura Wallet Balance</span>
          <span class="balance"><img class="aed" src="aed.png" alt="" width="16" height="16" /> 37.76</span>
        </div>
        <svg class="chev" viewBox="0 0 18 10" aria-hidden="true">
          <path d="M1.5 1.5 L9 8.2 L16.5 1.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </section>

      <div class="offers" aria-label="Offers">
        <article class="offer">
          <h3>Get 30% off with Aura Pass!</h3>
          <div class="pass-thumb">
            @AURAPASS
            <span class="big">30% OFF</span>
          </div>
          <button type="button" class="get" id="getOffer">Get Offer</button>
        </article>
        <article class="offer secondary">
          <h3>Muji and more with Aura</h3>
          <div class="pass-thumb" style="opacity:0.85">MUJI</div>
          <button type="button" class="get" disabled style="opacity:0.55">Get Offer</button>
        </article>
      </div>
    </div>

    <nav class="tabbar" aria-label="Main">
      <button type="button" class="tab active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
        Home
      </button>
      <button type="button" class="tab" id="tabOffers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V4h9l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/></svg>
        Offers
      </button>
      <button type="button" class="tab tab-aura" id="tabAuraId" aria-label="Aura ID">
        <span class="fab">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h3v3h-3zm5 0h1v6h-6v-1"/></svg>
          Aura ID
        </span>
      </button>
      <button type="button" class="tab">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5L12 2zm6 12l.9 3.1L22 18l-3.1.9L18 22l-.9-3.1L14 18l3.1-.9L18 14zM6 14l.7 2.3L9 17l-2.3.7L6 20l-.7-2.3L3 17l2.3-.7L6 14z"/></svg>
        Exclusives
      </button>
      <button type="button" class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        Brands
      </button>
    </nav>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle">Scan to Redeem</h2>
        <button type="button" class="x" id="close" aria-label="Close">×</button>
      </div>
      <div class="panel">
        <img src="qr-offer.png" alt="Offer QR" />
        <p>Scan your QR code at the store</p>
        <div class="or">OR</div>
        <p class="linkish">Link your Aura Account to purchase online &amp; apply the Aura Offer at cart</p>
      </div>
      <div class="scans">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
        Number of scans: 32
      </div>
      <a class="terms" href="#">View Terms and Conditions</a>
    </div>
  </div>
  <script>
    const sheet = document.getElementById("sheet");
    const scrim = document.getElementById("scrim");
    const open = () => { sheet.classList.add("open"); scrim.classList.add("open"); };
    const close = () => { sheet.classList.remove("open"); scrim.classList.remove("open"); };
    document.getElementById("getOffer").addEventListener("click", open);
    document.getElementById("tabAuraId").addEventListener("click", open);
    document.getElementById("tabOffers").addEventListener("click", open);
    document.getElementById("close").addEventListener("click", close);
    scrim.addEventListener("click", close);
    document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  </script>
</body>
</html>
