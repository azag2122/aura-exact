<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aura" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Aura</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    .stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    .phone {
      position: relative;
      width: min(100vw, calc(100vh * 1320 / 2868));
      height: min(100vh, calc(100vw * 2868 / 1320));
      max-width: 430px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
    }
    .home {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* Aura ID center FAB — bottom nav */
    .hit-aura-id {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 1.8%;
      transform: translateX(-50%);
      width: 18%;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }
    .hit-aura-id:active { background: rgba(233,30,140,0.15); }
    /* Also allow Offers tab / Explore offers as secondary open */
    .hit-offers {
      position: absolute;
      z-index: 2;
      left: 18%;
      bottom: 0.5%;
      width: 16%;
      height: 7.5%;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .scrim {
      position: absolute; inset: 0; z-index: 3;
      background: rgba(30, 10, 50, 0.42);
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s ease;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 4;
      width: 100%;
      transform: translate3d(0, 105%, 0);
      transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform;
      pointer-events: none;
    }
    .sheet.open {
      transform: translate3d(0, 0, 0);
      pointer-events: auto;
    }
    .sheet img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 86vh;
      object-fit: contain;
      object-position: bottom;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 -10px 28px rgba(0,0,0,0.35));
    }
    .hit-close {
      position: absolute;
      top: 1.2%;
      right: 2%;
      width: 14%;
      aspect-ratio: 1;
      border: 0;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <img class="home" src="home.png" alt="Aura" draggable="false" />
      <button type="button" class="hit-offers" id="openOffers" aria-label="Offers"></button>
      <button type="button" class="hit-aura-id" id="open" aria-label="Aura ID"></button>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true">
        <img src="sheet.png" alt="Scan to Redeem" draggable="false" />
        <button type="button" class="hit-close" id="close" aria-label="Close"></button>
      </div>
    </div>
  </div>
  <script>
    const sheet = document.getElementById("sheet");
    const scrim = document.getElementById("scrim");
    const open = () => { sheet.classList.add("open"); scrim.classList.add("open"); };
    const close = () => { sheet.classList.remove("open"); scrim.classList.remove("open"); };
    document.getElementById("open").addEventListener("click", open);
    document.getElementById("openOffers").addEventListener("click", open);
    document.getElementById("close").addEventListener("click", close);
    scrim.addEventListener("click", close);
    document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  </script>
</body>
</html>
