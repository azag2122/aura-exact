<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aura" />
  <meta name="theme-color" content="#F4F2F7" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Aura</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; touch-action:manipulation; overscroll-behavior:none; }
    .stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    .phone {
      position:relative;
      width: min(100vw, calc(100vh * 926 / 1224));
      height: min(100vh, calc(100vw * 1224 / 926));
      max-width: 430px;
      background:#F3F1F6; overflow:hidden;
    }
    .home { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; z-index:1; pointer-events:none; user-select:none; -webkit-user-drag:none; }
    .nav { position:absolute; left:0; right:0; bottom:0; width:100%; z-index:2; pointer-events:none; user-select:none; -webkit-user-drag:none; display:block; }
    .hit-offer {
      position:absolute; z-index:3;
      left: 6%; top: 66%; width: 38%; height: 7%;
      border:0; background:transparent; border-radius:999px; cursor:pointer;
    }
    .hit-offer:active { background:rgba(233,30,140,0.12); }
    .hit-aura-id {
      position:absolute; z-index:3;
      left:50%; bottom:1.2%; transform:translateX(-50%);
      width:17%; aspect-ratio:1; border:0; border-radius:50%; background:transparent; cursor:pointer;
    }
    .scrim { position:absolute; inset:0; z-index:4; background:rgba(30,10,50,0.4); opacity:0; pointer-events:none; transition:opacity .25s ease; }
    .scrim.open { opacity:1; pointer-events:auto; }
    .sheet { position:absolute; left:0; right:0; bottom:0; z-index:5; width:100%; transform:translate3d(0,105%,0); transition:transform .4s cubic-bezier(.32,.72,0,1); pointer-events:none; }
    .sheet.open { transform:translate3d(0,0,0); pointer-events:auto; }
    .sheet img { display:block; width:100%; height:auto; max-height:86vh; object-fit:contain; object-position:bottom; user-select:none; -webkit-user-drag:none; filter:drop-shadow(0 -10px 28px rgba(0,0,0,.35)); }
    .hit-close { position:absolute; top:1.2%; right:2%; width:14%; aspect-ratio:1; border:0; background:transparent; border-radius:50%; cursor:pointer; z-index:6; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <img class="home" src="home.png" alt="Aura" draggable="false" />
      <img class="nav" src="nav.png" alt="" draggable="false" />
      <button type="button" class="hit-offer" id="open" aria-label="Get Offer"></button>
      <button type="button" class="hit-aura-id" id="openId" aria-label="Aura ID"></button>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true">
        <img src="sheet.png" alt="Scan to Redeem" draggable="false" />
        <button type="button" class="hit-close" id="close" aria-label="Close"></button>
      </div>
    </div>
  </div>
  <script>
    const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
    const open=()=>{sheet.classList.add('open');scrim.classList.add('open');};
    const close=()=>{sheet.classList.remove('open');scrim.classList.remove('open');};
    document.getElementById('open').addEventListener('click',open);
    document.getElementById('openId').addEventListener('click',open);
    document.getElementById('close').addEventListener('click',close);
    scrim.addEventListener('click',close);
  </script>
</body>
</html>
